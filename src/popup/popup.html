<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>原神 報酬自動受取</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body class="popup">
    <header class="app-header">
      <h1 class="app-title">原神 報酬自動受取</h1>
      <button id="open-options" class="icon-button" type="button" aria-label="詳細設定を開く" title="詳細設定">
        <span aria-hidden="true">⚙</span>
      </button>
    </header>

    <main class="stack">
      <section class="card" aria-labelledby="account-heading">
        <h2 id="account-heading" class="visually-hidden">アカウント</h2>
        <div id="role-info" class="role" hidden>
          <p id="role-name" class="role-name"></p>
          <p class="role-meta">
            <span id="role-uid"></span>
            <button id="copy-uid" class="text-button" type="button">UIDをコピー</button>
            <span id="copy-feedback" class="feedback" aria-live="polite"></span>
          </p>
          <p id="role-server" class="role-meta"></p>
          <div id="role-select-row" class="field" hidden>
            <label for="role-select">対象キャラクター</label>
            <select id="role-select"></select>
          </div>
        </div>
        <div id="role-empty" class="empty" hidden>
          <p>原神のキャラクターが見つかりません。ブラウザでHoYoLABにログインしてから、もう一度開いてください。交換コードの引き換えには公式交換サイトへのログインも必要です。</p>
          <p id="role-empty-links" class="link-row"></p>
        </div>
        <div id="sessions" class="sessions"></div>
        <p id="account-result" class="result" aria-live="polite"></p>
      </section>

      <section class="card" aria-labelledby="checkin-heading">
        <div class="card-head">
          <h2 id="checkin-heading">ログインボーナス</h2>
          <span id="checkin-chip"></span>
        </div>
        <p id="checkin-detail" class="detail"></p>
        <p id="checkin-captcha" class="callout" hidden></p>
        <dl class="meta">
          <div><dt>前回実行</dt><dd id="checkin-last"></dd></div>
          <div><dt>次回予定</dt><dd id="checkin-next"></dd></div>
        </dl>
        <div class="actions">
          <label class="switch">
            <input id="auto-checkin" type="checkbox" role="switch" />
            <span>自動受取</span>
          </label>
          <button id="checkin-run" class="button primary" type="button">今すぐ受取</button>
        </div>
        <p id="checkin-result" class="result" aria-live="polite"></p>
      </section>

      <section class="card" aria-labelledby="redeem-heading">
        <div class="card-head">
          <h2 id="redeem-heading">交換コード</h2>
          <span id="redeem-chip"></span>
        </div>
        <dl class="meta">
          <div><dt>前回実行</dt><dd id="redeem-last"></dd></div>
          <div><dt>次回予定</dt><dd id="redeem-next"></dd></div>
        </dl>
        <p id="redeem-detail" class="detail"></p>
        <div class="actions">
          <div class="field">
            <label for="redeem-mode">定期確認</label>
            <select id="redeem-mode"></select>
          </div>
          <button id="redeem-run" class="button primary" type="button">今すぐ確認</button>
        </div>
        <p id="redeem-result" class="result" aria-live="polite"></p>
        <form id="code-form" class="code-form" novalidate>
          <label for="code-input">コードを入力して引き換え</label>
          <div class="input-row">
            <input id="code-input" type="text" maxlength="30" autocomplete="off" spellcheck="false" placeholder="例: GENSHINGIFT" />
            <button id="code-submit" class="button" type="submit">引き換え</button>
          </div>
        </form>
        <p id="code-result" class="result" aria-live="polite"></p>
      </section>

      <p class="note">※ 自動実行は公式機能ではないため既定でオフです。詳細は<button id="note-options" class="text-button" type="button">設定画面</button>をご覧ください。</p>

      <section class="card" aria-labelledby="history-heading">
        <h2 id="history-heading">最近の履歴</h2>
        <ul id="history-list" class="history-list"></ul>
        <button id="open-history" class="text-button" type="button">すべての履歴と設定</button>
      </section>
    </main>
  </body>
</html>
